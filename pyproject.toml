[project]
name = "easy-viewer"
version = "0.1.0"
description = "Standalone viewer for easy-flow generated fund community posts."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pymysql>=1.1.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
